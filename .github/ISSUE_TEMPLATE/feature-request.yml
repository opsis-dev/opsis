name: Feature request
description: An idea for Opsis
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The video or workflow you want to make, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: A node, a setting, an action, or a change to the editor.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
