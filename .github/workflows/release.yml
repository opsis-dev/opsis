name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NSIS_URL: https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip
  NSIS_SHA256: c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1
  WIX_VERSION: 7.0.1

jobs:
  notice:
    name: Source notice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Check the links in the source notice
        run: bun run notice:links

  package:
    name: Package · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            formats: deb,rpm,pacman,appimage
          - name: Windows x64
            os: windows-latest
            formats: nsis,msi
          - name: macOS Apple Silicon
            os: macos-latest
            formats: app,dmg
          - name: macOS Intel
            os: macos-26-intel
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-29
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-${{ matrix.os }}
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Install the system libraries setup checks for and the packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm makepkg pacman-package-manager libarchive-tools patchelf fakeroot clang libc++-dev libc++abi-dev libasound2-dev libatspi2.0-dev libdbus-1-dev libfontconfig1-dev libfreetype-dev libwayland-dev wayland-protocols libx11-dev libx11-xcb-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xkb-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        if: runner.os == 'Linux'
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - name: Cache what setup fetches and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/opsis-dev
          key: setup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lib/setup/**', 'scripts/lib/static-qt.ts', 'scripts/lib/skia.ts') }}
      - name: Set up the pinned tools, the static Qt, Skia, Filament and FFmpeg
        run: bun run setup --no-engine
      - name: Fetch the terminal engine
        working-directory: crates/vt/zig
        run: ../../../.setup/bin/zig build --fetch
      - name: Cache the downloaded browser and its licences
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev/stage-engine
            ~/.cache/opsis-dev/chromium-credits
          key: stage-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/src/downloads.generated.json') }}
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nsis.zip" "$NSIS_URL"
          echo "$NSIS_SHA256  $RUNNER_TEMP/nsis.zip" | sha256sum --check
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/nsis.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/nsis-3.11" >> "$GITHUB_PATH"
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version "$WIX_VERSION"
      - name: Build the installers
        env:
          OPSIS_UPDATE_KEY: ${{ secrets.OPSIS_UPDATE_KEY }}
          OPSIS_UPDATE_KEY_PASSWORD: ${{ secrets.OPSIS_UPDATE_KEY_PASSWORD }}
        run: bun run make -- --formats ${{ matrix.formats }}
      - name: Check the bundled FFmpeg has everything Opsis uses
        run: bun run test:rust -p opsis-media --lib capabilities
      - name: Install and run each package in a plain Debian
        if: runner.os == 'Linux'
        run: bun run package:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: opsis-${{ runner.os }}-${{ runner.arch }}
          path: |
            ~/.cache/opsis-dev/build/*.deb
            ~/.cache/opsis-dev/build/*.rpm
            ~/.cache/opsis-dev/build/*.pkg.tar.zst
            ~/.cache/opsis-dev/build/*.AppImage
            ~/.cache/opsis-dev/build/*-setup.exe
            ~/.cache/opsis-dev/build/*.msi
            ~/.cache/opsis-dev/build/*.app.tar.gz
            ~/.cache/opsis-dev/build/*.dmg
            ~/.cache/opsis-dev/build/*.sig
            ~/.cache/opsis-dev/build/*.update.json
          if-no-files-found: error

  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [notice, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Write the update feed
        run: bun scripts/release-feed.ts "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/artifacts/latest.json" "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/artifacts"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "Opsis ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" \
            ./*.deb ./*.rpm ./*.pkg.tar.zst ./*.AppImage ./*-setup.exe ./*.msi ./*.app.tar.gz ./*.dmg latest.json
