name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-29
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch the terminal engine
        working-directory: crates/vt/zig
        run: zig build --fetch
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8
      - name: Install the webview's build packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: astral-sh/setup-uv@v10
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: 6.12.0
          cache: true
      - name: Point the native editor at Qt
        run: echo "OPSIS_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Fetch KDDockWidgets
        run: bun run qt:install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun run test
      - name: Check the links in the source notice
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun run notice:links
      - name: Install the end-to-end suite
        working-directory: e2e
        run: bun install --frozen-lockfile
      - name: Check the end-to-end suite
        working-directory: e2e
        run: bun run typecheck && bun run lint && bun run format

  build:
    name: Build · ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-26-intel]
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: app,dmg
          - os: macos-26-intel
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-29
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: ${{ matrix.os }}
      - name: Fetch the terminal engine
        working-directory: crates/vt/zig
        run: zig build --fetch
      - name: Install the webview's build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      - name: Cache the downloaded browser and its licences
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/opsis-stage-engine
            ~/.cache/opsis-chromium-credits
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/src/downloads.generated.json') }}
      - name: Check the terminal engine
        run: cargo test -p opsis-vt && cargo test -p opsis-vt --release
      - name: Build
        run: bun run make -- --bundles ${{ matrix.bundles }}
      - name: Check the licences the app ships
        shell: bash
        run: |
          test -f resources/engine-licences/LICENSES.chromium.html
          test -f resources/LICENSE.ffmpeg.txt
      - name: Check the bundled FFmpeg has everything Opsis uses
        run: bun run test:rust -p opsis-media --lib capabilities
      - name: Check every program in the app is signed
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          find target/release/bundle/macos -type f -perm -u+x -print0 | while IFS= read -r -d '' file; do
            if file "$file" | grep -q Mach-O; then codesign -dv "$file"; fi
          done
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: cd target/release/bundle/macos && ditto -c -k --keepParent Opsis.app Opsis.zip
      - uses: actions/upload-artifact@v7
        with:
          name: opsis-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/macos/*.zip
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  e2e:
    name: End-to-end
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-29
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch the terminal engine
        working-directory: crates/vt/zig
        run: zig build --fetch
      - name: Install the webview, video playback and virtual display
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev gstreamer1.0-libav xvfb xauth
      - run: bun install --frozen-lockfile
      - name: Install the end-to-end suite
        working-directory: e2e
        run: bun install --frozen-lockfile
      - name: Cache the engine
        uses: actions/cache@v6
        with:
          path: ~/.config/Opsis/engine
          key: dev-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/src/downloads.generated.json') }}
      - name: Install the engine
        run: cargo run -q --release -p opsis-engine --bin install-engine -- ~/.config/Opsis/engine
      - run: bun run film:bundle
      - run: bun run terminal:bundle
      - run: bun run test:e2e
