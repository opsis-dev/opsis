name: Build

on:
  push:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-29
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: cargo-deny@0.19.8
      - name: Install the sound library, the virtual display and headless Wayland
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xkb1 sway
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: 6.12.0
          cache: true
      - name: Point the native editor at Qt
        run: echo "OPSIS_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Cache Zig and its packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev/zig
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/zig-install.ts', 'crates/vt/zig/build.zig.zon') }}
      - name: Install Zig
        shell: bash
        run: |
          bun run zig:install | tee "$RUNNER_TEMP/zig-install.log"
          sed -n 's/^Zig [^:]*: //p' "$RUNNER_TEMP/zig-install.log" >> "$GITHUB_PATH"
      - name: Fetch the terminal engine
        working-directory: crates/vt/zig
        run: zig build --fetch
      - name: Fetch KDDockWidgets
        run: bun run qt:install
      - name: Cache Skia and Filament
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev/skia
            ~/.cache/opsis-dev/filament
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/skia-build.ts', 'scripts/filament-build.ts', 'scripts/lib/filament.ts', 'scripts/lib/filament/**', 'crates/filament/cpp/**', 'crates/filament/downloads.generated.json') }}
      - name: Build Skia
        run: bun run skia:build
      - name: Build the sealed Filament wrapper
        run: bun run filament:build --docker
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun run test
      - name: Drive the native editor with real input on headless Wayland
        run: bun run e2e:qt wayland
      - name: Check the terminal engine in a release build
        run: cargo test -p opsis-vt --release
      - name: Check the bundled FFmpeg has everything Opsis uses
        run: bun run test:rust -p opsis-media --lib capabilities
      - name: Cache the engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.config/Opsis/engine
          key: dev-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/src/downloads.generated.json') }}
      - name: Install the engine
        run: cargo run -q --release -p opsis-engine --bin install-engine -- ~/.config/Opsis/engine
      - name: Compare every element with its golden picture on the software graphics driver
        run: bun run ffmpeg:stage && cargo build -p opsis-effects --bin opsis-renderer && OPSIS_FFMPEG="$PWD/target/ffmpeg/opsis-ffmpeg-x86_64-unknown-linux-gnu" cargo test -p opsis-render --test goldens -- --ignored

  scripts:
    name: Script sandbox on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-29
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Check that scripts reach only the project's files
        run: cargo test -p opsis-script

  e2e:
    name: End-to-end
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-29
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Install the sound library and the virtual display
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xkb1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: 6.12.0
          cache: true
      - name: Point the native editor at Qt
        run: echo "OPSIS_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Cache Zig and its packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev/zig
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/zig-install.ts', 'crates/vt/zig/build.zig.zon') }}
      - name: Install Zig
        shell: bash
        run: |
          bun run zig:install | tee "$RUNNER_TEMP/zig-install.log"
          sed -n 's/^Zig [^:]*: //p' "$RUNNER_TEMP/zig-install.log" >> "$GITHUB_PATH"
      - name: Fetch the terminal engine
        working-directory: crates/vt/zig
        run: zig build --fetch
      - name: Cache the engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.config/Opsis/engine
          key: dev-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/src/downloads.generated.json') }}
      - name: Install the engine
        run: cargo run -q --release -p opsis-engine --bin install-engine -- ~/.config/Opsis/engine
      - name: Fetch KDDockWidgets
        run: bun run qt:install
      - name: Cache Skia and Filament
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev/skia
            ~/.cache/opsis-dev/filament
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/skia-build.ts', 'scripts/filament-build.ts', 'scripts/lib/filament.ts', 'scripts/lib/filament/**', 'crates/filament/cpp/**', 'crates/filament/downloads.generated.json') }}
      - name: Build Skia
        run: bun run skia:build
      - name: Build the sealed Filament wrapper
        run: bun run filament:build --docker
      - name: Drive the native editor through real runs
        run: bun run e2e:qt tour runs api
