name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-29
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch the terminal engine
        working-directory: crates/vt/zig
        run: zig build --fetch
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8
      - name: Install the sound library, the virtual display and headless Wayland
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xkb1 sway
      - uses: astral-sh/setup-uv@v10
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: 6.12.0
          cache: true
      - name: Point the native editor at Qt
        run: echo "OPSIS_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Fetch KDDockWidgets
        run: bun run qt:install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun run test
      - name: Drive the native editor with real input on headless Wayland
        run: bun run e2e:qt wayland
      - name: Check the terminal engine in a release build
        run: cargo test -p opsis-vt --release
      - name: Check the bundled FFmpeg has everything Opsis uses
        run: bun run test:rust -p opsis-media --lib capabilities
      - name: Check the links in the source notice
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun run notice:links

  e2e:
    name: End-to-end
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-29
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch the terminal engine
        working-directory: crates/vt/zig
        run: zig build --fetch
      - name: Install the sound library and the virtual display
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xkb1
      - uses: astral-sh/setup-uv@v10
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: 6.12.0
          cache: true
      - name: Point the native editor at Qt
        run: echo "OPSIS_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Cache the engine
        uses: actions/cache@v6
        with:
          path: ~/.config/Opsis/engine
          key: dev-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/src/downloads.generated.json') }}
      - name: Install the engine
        run: cargo run -q --release -p opsis-engine --bin install-engine -- ~/.config/Opsis/engine
      - run: bun run film:bundle
      - run: bun run terminal:bundle
      - name: Fetch KDDockWidgets
        run: bun run qt:install
      - name: Drive the native editor through real runs
        run: bun run e2e:qt tour runs api
