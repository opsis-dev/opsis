name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the webview's build packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun run test

  build:
    name: ${{ matrix.edition }} · ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-26-intel]
        edition: [full, lite]
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app
          - os: macos-26-intel
            bundles: app
    runs-on: ${{ matrix.os }}
    env:
      OPSIS_EDITION: ${{ matrix.edition }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the webview's build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      - name: Cache the engine and the browser licences
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/opsis-stage-engine
            ~/.cache/opsis-chromium-credits
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/src/downloads.generated.json') }}
      - name: Build
        run: bun run make -- --bundles ${{ matrix.bundles }}
      - name: Check the engine and its licences
        if: matrix.edition == 'full'
        shell: bash
        run: |
          test -f resources/engine/LICENSES.chromium.html
          test -f resources/engine/ffmpeg/LICENSE.txt
      - name: Check the licences the lite edition ships
        if: matrix.edition == 'lite'
        shell: bash
        run: test -f resources/engine-licences/LICENSES.chromium.html
      - name: Check every program in the app is signed
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          find target/release/bundle/macos -type f -perm -u+x -print0 | while IFS= read -r -d '' file; do
            if file "$file" | grep -q Mach-O; then codesign -dv "$file"; fi
          done
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: cd target/release/bundle/macos && ditto -c -k --keepParent Opsis.app Opsis.zip
      - uses: actions/upload-artifact@v7
        with:
          name: opsis-${{ matrix.edition }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.zip
          if-no-files-found: error

  e2e:
    name: End-to-end
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the webview, video playback and virtual display
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev gstreamer1.0-libav xvfb xauth
      - run: bun install --frozen-lockfile
      - name: Cache the engine
        uses: actions/cache@v6
        with:
          path: ~/.config/Opsis/engine
          key: dev-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/src/downloads.generated.json') }}
      - name: Install the engine
        run: cargo run -q --release -p opsis-engine --bin install-engine -- ~/.config/Opsis/engine
      - run: bun run video:bundle
      - run: bun run test:e2e
