name: Build

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks · Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-29
          components: clippy, rustfmt, llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: cargo-deny@0.19.8
      - name: Install the system libraries setup checks for
        run: sudo apt-get update && sudo apt-get install -y clang libc++-dev libc++abi-dev libasound2-dev libatspi2.0-dev libdbus-1-dev libfontconfig1-dev libfreetype-dev libwayland-dev wayland-protocols libx11-dev libx11-xcb-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xkb-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: bun install --frozen-lockfile
      - name: Restore what setup fetched and built
        id: setup-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev
            ~/.config/Opsis/engine
          key: setup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lib/setup/**', 'scripts/lib/static-qt.ts', 'scripts/lib/skia.ts', 'scripts/lib/filament.ts', 'scripts/lib/git-source.ts', 'crates/engine/src/downloads.generated.json') }}
      - name: Set up the pinned tools, Qt, Skia, Filament, FFmpeg and the engine
        run: bun run setup
      - name: Keep what setup fetched and built
        if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev
            ~/.config/Opsis/engine
          key: setup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lib/setup/**', 'scripts/lib/static-qt.ts', 'scripts/lib/skia.ts', 'scripts/lib/filament.ts', 'scripts/lib/git-source.ts', 'crates/engine/src/downloads.generated.json') }}
      - name: Fetch the terminal engine
        id: zig
        working-directory: crates/vt/zig
        run: ../../../.setup/bin/zig build --fetch
      - name: Typecheck the scripts
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: bun run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: bun run lint
      - name: Check the formatting
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: bun run format
      - name: Run the scripts' tests
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: bun run test:ts
      - name: Run the Rust tests
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: bun scripts/test-rust.ts --workspace --no-fail-fast
      - name: Check the terminal engine in a release build
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: cargo test -p opsis-vt --release

  platforms:
    name: Build · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            os: ubuntu-24.04-arm
            packages: --workspace
          - name: Windows x64
            os: windows-latest
            packages: --workspace --exclude opsis-e2e-input
          # FIXME(ffmpeg): no macOS Apple Silicon job until Opsis builds its own FFmpeg, since ffmpeg-static's Apple Silicon build is configured with --enable-nonfree (plans/ffmpeg.md section 2)
          - name: macOS Intel
            os: macos-26-intel
            packages: --workspace --exclude opsis-e2e-input
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-29
          components: clippy, llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Install the system libraries setup checks for
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libc++-dev libc++abi-dev libasound2-dev libatspi2.0-dev libdbus-1-dev libfontconfig1-dev libfreetype-dev libwayland-dev wayland-protocols libx11-dev libx11-xcb-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xkb-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        if: runner.os == 'Linux'
      - name: Restore what setup fetched and built
        id: setup-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev
            ~/.config/Opsis/engine
          key: setup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lib/setup/**', 'scripts/lib/static-qt.ts', 'scripts/lib/skia.ts', 'scripts/lib/filament.ts', 'scripts/lib/git-source.ts', 'crates/engine/src/downloads.generated.json') }}
      - name: Set up the pinned tools, Qt, Skia, Filament, FFmpeg and the engine
        run: bun run setup
      - name: Keep what setup fetched and built
        if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/opsis-dev
            ~/.config/Opsis/engine
          key: setup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lib/setup/**', 'scripts/lib/static-qt.ts', 'scripts/lib/skia.ts', 'scripts/lib/filament.ts', 'scripts/lib/git-source.ts', 'crates/engine/src/downloads.generated.json') }}
      - name: Fetch the terminal engine
        id: zig
        working-directory: crates/vt/zig
        run: ../../../.setup/bin/zig build --fetch
      - name: Lint the Rust
        run: cargo clippy ${{ matrix.packages }} --all-targets -- -D warnings
      - name: Run the Rust tests
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: bun scripts/test-rust.ts ${{ matrix.packages }} --no-fail-fast
