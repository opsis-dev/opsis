[package]
name = "opsis-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opsis-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
env_logger.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
log.workspace = true
opsis-folders.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-std"] }

[dev-dependencies]
axum.workspace = true
proptest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
