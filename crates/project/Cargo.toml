[package]
name = "opsis-project"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gltf = { version = "1.4.1", default-features = false }
log = "0.4.34"
nanoid = "0.5.0"
notify-debouncer-mini = "0.7.0"
opsis-compile = { version = "0.1.0", path = "../compile" }
opsis-engine = { version = "0.1.0", path = "../engine" }
opsis-types = { version = "0.1.0", path = "../types" }
path-clean = "1.0.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
shellexpand = "3.1.2"
slug = "0.1.6"
specta = { version = "2.0.0-rc.27", features = ["derive"] }
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
filetime = "0.2.29"
indexmap = "2.14.2"
tempfile = "3.27.0"
