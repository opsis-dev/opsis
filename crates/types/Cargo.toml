[package]
name = "opsis-types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
garde = { version = "0.23.0", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
slug = "0.1.6"
smart-default = "0.7.1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "indexmap", "serde_json"] }
specta-serde = "=0.0.13"
specta-typescript = "=0.0.13"

[dev-dependencies]
opsis-golden = { path = "../golden" }
