[package]
name = "opsis-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fontdb = "0.24.0"
log = "0.4.34"
opsis-compile = { version = "0.1.0", path = "../compile" }
opsis-engine = { version = "0.1.0", path = "../engine" }
opsis-store = { version = "0.1.0", path = "../store" }
opsis-types = { version = "0.1.0", path = "../types" }
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
skrifa = "0.49.0"
specta = { version = "2.0.0-rc.27", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
uuid = { version = "1.29.0", features = ["v4"] }
wuff = "0.2.9"
zip = "9.1.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
wiremock = "0.6.5"
