[package]
name = "opsis-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chromiumoxide = "0.9.1"
futures = "0.3.34"
indexmap = "2.14.2"
log = "0.4.34"
opsis-capture = { version = "0.1.0", path = "../capture" }
opsis-compile = { version = "0.1.0", path = "../compile" }
opsis-engine = { version = "0.1.0", path = "../engine" }
opsis-prepare = { version = "0.1.0", path = "../prepare" }
opsis-runner = { version = "0.1.0", path = "../runner" }
opsis-types = { version = "0.1.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "sync", "net"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["fs"] }
url = "2.5.8"

[dev-dependencies]
futures = "0.3.34"
imagesize = "0.15.0"
opsis-project = { path = "../project" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
