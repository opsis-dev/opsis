[package]
name = "opsis-desktop"
default-run = "opsis-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
env_logger.workspace = true
futures.workspace = true
indexmap.workspace = true
log.workspace = true
opsis-api.workspace = true
opsis-capture.workspace = true
opsis-compile.workspace = true
opsis-document.workspace = true
opsis-engine.workspace = true
opsis-fonts.workspace = true
opsis-image.workspace = true
opsis-media.workspace = true
opsis-project.workspace = true
opsis-render.workspace = true
opsis-runner.workspace = true
opsis-store.workspace = true
opsis-stream.workspace = true
opsis-traces.workspace = true
opsis-types.workspace = true
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
specta = { workspace = true, features = ["serde_json", "indexmap"] }
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
tauri-specta.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
  "fs",
  "signal",
] }
tokio-util.workspace = true
tower.workspace = true
uuid.workspace = true

[build-dependencies]
tauri-build.workspace = true

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]
export-bindings = []

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["export-bindings"]

[lints]
workspace = true
