[package]
name = "opsis-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
garde = "0.23.0"
hex = "0.4.3"
keyring-core = "1.0.1"
log = "0.4.34"
opsis-types = { version = "0.1.0", path = "../types" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
specta = { version = "2.0.0-rc.27", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
