[package]
name = "opsis-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log = "0.4.34"
opsis-compile = { version = "0.1.0", path = "../compile" }
opsis-engine = { version = "0.1.0", path = "../engine" }
opsis-footage = { version = "0.1.0", path = "../footage" }
opsis-media = { version = "0.1.0", path = "../media" }
opsis-prepare = { version = "0.1.0", path = "../prepare" }
opsis-probe = { version = "0.1.0", path = "../probe" }
opsis-project = { version = "0.1.0", path = "../project" }
opsis-runner = { version = "0.1.0", path = "../runner" }
opsis-types = { version = "0.1.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "process",
  "io-util",
  "macros",
  "rt",
  "fs",
  "sync",
  "time",
] }
tokio-util = "0.7.20"

[dev-dependencies]
image = "0.25.10"
opsis-capture = { path = "../capture" }
opsis-golden = { path = "../golden" }
opsis-image = { path = "../image" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
