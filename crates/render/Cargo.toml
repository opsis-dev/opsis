[package]
name = "opsis-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3.34"
indexmap = "2.14.2"
log = "0.4.34"
opsis-compile = { version = "0.1.0", path = "../compile" }
opsis-engine = { version = "0.1.0", path = "../engine" }
opsis-media = { version = "0.1.0", path = "../media" }
opsis-project = { version = "0.1.0", path = "../project" }
opsis-runner = { version = "0.1.0", path = "../runner" }
opsis-types = { version = "0.1.0", path = "../types" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
specta = { version = "2.0.0-rc.27", features = ["derive", "serde_json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "process",
  "io-util",
  "macros",
  "rt",
  "fs",
  "sync",
  "time",
] }
tokio-util = "0.7.20"
walkdir = "2.5.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
