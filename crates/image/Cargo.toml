[package]
name = "opsis-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ab_glyph = "0.2.32"
csscolorparser = "0.9.0"
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = "0.25.10"
imageproc = "0.27.0"
moxcms = "0.9.1"
num-traits = "0.2.19"
opsis-compile = { version = "0.1.0", path = "../compile" }
opsis-engine = { version = "0.1.0", path = "../engine" }
opsis-media = { version = "0.1.0", path = "../media" }
opsis-runner = { version = "0.1.0", path = "../runner" }
opsis-types = { version = "0.1.0", path = "../types" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
wuff = "0.2.9"

[dev-dependencies]
moxcms = "0.9.1"
opsis-golden = { path = "../golden" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread"] }
