[package]
name = "opsis-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
humansize = "2.1.3"
log = "0.4.34"
opsis-types = { version = "0.1.0", path = "../types" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "macros", "net"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
zip = "9.1.0"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.191"

[dev-dependencies]
filetime = "0.2.29"
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
