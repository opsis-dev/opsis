[package]
name = "opsis-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
futures = "0.3.34"
indexmap = "2.14.2"
log = "0.4.34"
opsis-compile = { version = "0.1.0", path = "../compile" }
opsis-types = { version = "0.1.0", path = "../types" }
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
specta = { version = "=2.0.0-rc.26", features = ["derive", "indexmap", "serde_json"] }
tokio = { version = "1.54.1", features = ["net", "sync", "time", "macros", "rt", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[target."cfg(windows)".dependencies]
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
